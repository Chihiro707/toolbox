[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolbox-chihiro"
version = "0.1.0"
description = "Reusable Python utilities for research"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib"
]

[tool.setuptools.packages.find]
where = ["src"]