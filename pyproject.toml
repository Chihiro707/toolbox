[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolbox-chihiro"
version = "0.1.0"
description = "Reusable Python utilities for research"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy",
    "pandas == 2.2.3",
    "matplotlib",
    "xarray",
    "netCDF4 == 1.7.2"
]

[tool.setuptools.packages.find]
where = ["src"]